workflows:
  ios-build:
    name: iOS Build & Submit
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
      ios_signing:
        provisioning_profiles:
          - padelplayers_dist_profile
        certificates:
          - Padel Players App
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods
        script: |
          cd src
          pod install
      - name: Set up signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd src
          xcode-project build-ipa \
            --workspace "Padel Players App.xcworkspace" \
            --scheme "Padel Players App"
      - name: Upload to App Store Connect
        script: |
          app-store-connect publish \
            --path 'src/build/ios/ipa/*.ipa' \
            --apple-id "$APPLE_ID_EMAIL" \
            --password "$APP_SPECIFIC_PASSWORD"
    artifacts:
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
