workflows:
  ios-build:
    name: iOS Build & Submit
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wynaxa.padelplayers
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods
        script: |
          cd src
          pod install
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.wynaxa.padelplayers \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd src
          xcode-project build-ipa \
            --workspace "Padel Players App.xcworkspace" \
            --scheme "Padel Players App"
    artifacts:
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
