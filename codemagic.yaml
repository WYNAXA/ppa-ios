workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.padelplayersapp.app"
        XCODE_PROJECT: "src/Padel Players App.xcodeproj"
        XCODE_SCHEME: "Padel Players App"
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd src
          pod install
      - name: Build unsigned IPA
        script: |
          cd src
          xcodebuild \
            -workspace "Padel Players App.xcworkspace" \
            -scheme "Padel Players App" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build
    artifacts:
      - src/build/**/*.app
      - src/build/**/*.ipa
