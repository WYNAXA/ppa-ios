workflows:
  ios-build:
    name: iOS Build & Submit
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        provisioning_profiles:
          - padelplayers_dist_profile
        certificates:
          - Padel Players App
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id 6762192246"
    scripts:
      - name: Install CocoaPods
        script: |
          cd src
          pod install
      - name: Set up signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd src
          xcode-project build-ipa \
            --workspace "Padel Players App.xcworkspace" \
            --scheme "Padel Players App"
    artifacts:
      - src/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
